<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com;">
    <title>App Store - Home</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Navbar Component -->
        <div id="navbar-container"></div>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Hero Section -->
            <section class="hero-section">
                <div class="container">
                    <h1>Discover Amazing Apps</h1>
                    <div class="search-box">
                        <input type="text" id="main-search" placeholder="Search for apps, games, tools...">
                        <button id="search-btn"><i class="fas fa-search"></i></button>
                    </div>
                </div>
            </section>
            
            <!-- Featured Apps -->
            <section class="featured-section">
                <div class="container">
                    <h2>Featured Apps</h2>
                    <div class="app-grid" id="featured-apps">
                        <!-- Dynamically loaded -->
                    </div>
                </div>
            </section>
            
            <!-- Trending Apps -->
            <section class="trending-section">
                <div class="container">
                    <h2>Trending Now</h2>
                    <div class="app-grid" id="trending-apps">
                        <!-- Dynamically loaded -->
                    </div>
                </div>
            </section>
            
            <!-- Categories -->
            <section class="categories-section">
                <div class="container">
                    <h2>Browse Categories</h2>
                    <div class="category-grid" id="categories-list">
                        <!-- Dynamically loaded -->
                    </div>
                </div>
            </section>
        </main>
        
        <!-- Footer Component -->
        <div id="footer-container"></div>
    </div>
    
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
